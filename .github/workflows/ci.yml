name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build web (demo mode)
        run: pnpm --filter @trash-wars/web build
        env:
          NEXT_PUBLIC_DEMO_MODE: "1"

      # Economy-sim regression gate (doc 13 §5.1): any change to the economy,
      # mission logic, or sink prices must keep the three S1 scenarios in band.
      - name: Economy sim regression gate
        run: node ops/check-sim-bands.mjs
